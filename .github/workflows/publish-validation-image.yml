name: Publish validation image

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Docker Hub image repository (for example allanayford/orchestrator-validation)
        required: true
        default: ayfordandco/ai-orchestrator-platform-validation
        type: string
      pnpm_version:
        description: pnpm version baked into the image
        required: false
        default: 11.19.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish validation image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/validation/Dockerfile
          build-args: PNPM_VERSION=${{ inputs.pnpm_version }}
          push: true
          tags: |
            docker.io/${{ inputs.repository }}:pnpm-${{ inputs.pnpm_version }}
            docker.io/${{ inputs.repository }}:pnpm-${{ inputs.pnpm_version }}-sha-${{ github.sha }}

      - name: Report immutable digest
        run: 'echo "Validation image digest: docker.io/${{ inputs.repository }}@${{ steps.image.outputs.digest }}"'

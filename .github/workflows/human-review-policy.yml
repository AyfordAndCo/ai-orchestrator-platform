name: Human review policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write

jobs:
  human-review-policy:
    name: Human review policy
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Request required human reviewer
        env:
          GH_TOKEN: ${{ secrets.GH_SERVICE_USER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REQUIRED_HUMAN_REVIEWER: ${{ vars.REQUIRED_HUMAN_REVIEWER || 'allanayford-dev' }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers"
          -f "reviewers[]=$REQUIRED_HUMAN_REVIEWER"
      - name: Enforce conditional human review
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SERVICE_USER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REQUIRED_HUMAN_REVIEWER: ${{ vars.REQUIRED_HUMAN_REVIEWER || 'allanayford-dev' }}
        run: node scripts/human-review-policy.mjs
